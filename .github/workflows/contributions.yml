name: contribution graph

on:
  schedule:
    - cron: "17 3 * * *"   # daily, a little after midnight UTC-ish
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/contributions.mjs, .github/workflows/contributions.yml]

permissions:
  contents: write

concurrency:
  group: contribution-graph
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Render contribution graph
        run: node scripts/contributions.mjs "${{ github.repository_owner }}" assets/contributions.svg

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/contributions.svg; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          git commit -m "chore: refresh contribution graph"
          git push
