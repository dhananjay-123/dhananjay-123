  <circle cx="256" cy="47" r="12" fill="none" stroke="#F0A63C" stroke-width="1">
    <animate attributeName="r" values="4;13" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="256" cy="47" r="4" fill="#F0A63C">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.8s" repeatCount="indefinite"/>
