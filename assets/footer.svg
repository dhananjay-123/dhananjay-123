      <circle cx="1" cy="1" r="1" fill="#14171C"/>
    </pattern>
  </defs>

  <rect width="880" height="124" rx="10" fill="#0B0C0E"/>
  <rect width="880" height="124" rx="10" fill="url(#fgrid)"/>
  <rect x="0.5" y="0.5" width="879" height="123" rx="10" stroke="#1C1F26"/>

  <g stroke="#F0A63C" stroke-width="1.25" opacity="0.55">
    <path d="M18 34 L18 18 L34 18"/>
    <path d="M862 34 L862 18 L846 18"/>
    <path d="M18 90 L18 106 L34 106"/>
    <path d="M862 90 L862 106 L846 106"/>
