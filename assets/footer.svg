<svg xmlns="http://www.w3.org/2000/svg" width="880" height="124" viewBox="0 0 880 124" fill="none" role="img" aria-labelledby="footTitle footDesc">
  <title id="footTitle">Open to open-source collaboration</title>
  <desc id="footDesc">A dark status panel reading OPEN TO OPEN-SOURCE COLLABORATION, above the links dhananjaypvt.me and github.com/dhananjay-123.</desc>

  <defs>
