<svg xmlns="http://www.w3.org/2000/svg" width="260" height="300" viewBox="0 0 260 300" role="img" aria-label="Avatar: Dot, a round two-tone creature, ink on one side and lime on the other, with small discs orbiting it">
<title>Dot</title>
<style>
.av * { transform-box: fill-box }
.av-float { animation: av-float 3.4s ease-in-out infinite alternate }
.av-shadow { transform-origin: center; animation: av-shadow 3.4s ease-in-out infinite alternate }
.av-tuft { transform-origin: 50% 100%; animation: av-tuft 1.7s ease-in-out infinite alternate }
.av-pupils { animation: av-look 8s ease-in-out infinite }
.av-eye { transform-origin: center; animation: av-blink 4.6s ease-in-out infinite }
.av-armL { transform-origin: 100% 0%; animation: av-wave 1.7s ease-in-out infinite alternate }
.av-armR { transform-origin: 0% 0%; animation: av-wave 1.7s ease-in-out -0.8s infinite alternate-reverse }
.av-foot { animation: av-foot 1.7s ease-in-out infinite alternate }
.av-spinA { transform-origin: center; animation: av-spin 6s linear infinite }
.av-keepA { transform-origin: center; animation: av-spin 6s linear infinite reverse }
.av-spinB { transform-origin: center; animation: av-spin 9.5s linear infinite reverse }
.av-keepB { transform-origin: center; animation: av-spin 9.5s linear infinite }
.av-star { transform-origin: center; animation: av-star 3s ease-in-out infinite }
@keyframes av-float { from { transform: translateY(4px) } to { transform: translateY(-6px) } }
@keyframes av-shadow { from { transform: scaleX(1); opacity: 0.5 } to { transform: scaleX(0.8); opacity: 0.28 } }
@keyframes av-tuft { from { transform: rotate(-9deg) scaleY(0.94) } to { transform: rotate(8deg) scaleY(1.06) } }
@keyframes av-look { 0%, 28% { transform: none } 34%, 52% { transform: translate(5px, 1px) } 58%, 76% { transform: translate(-5px, 1px) } 82%, 100% { transform: none } }
@keyframes av-blink { 0%, 91% { transform: scaleY(1) } 94% { transform: scaleY(0.08) } 97%, 100% { transform: scaleY(1) } }
@keyframes av-wave { from { transform: rotate(-10deg) } to { transform: rotate(12deg) } }
@keyframes av-foot { from { transform: translateY(0) } to { transform: translateY(3px) } }
@keyframes av-spin { to { transform: rotate(360deg) } }
@keyframes av-star { 0%, 100% { transform: scale(0.4); opacity: 0.15 } 50% { transform: scale(1); opacity: 0.9 } }
@media (prefers-reduced-motion: reduce) { .av * { animation: none !important } }
</style>
<g class="av" transform="scale(1)">
<defs>
  <radialGradient id="av-lime" cx="0.6" cy="0.62" r="0.75"><stop offset="0" stop-color="#e9ff9c"/><stop offset="0.45" stop-color="#c5f24a"/><stop offset="1" stop-color="#6f9a1c"/></radialGradient>
  <radialGradient id="av-ink" cx="0.3" cy="0.25" r="0.9"><stop offset="0" stop-color="#4b4470"/><stop offset="0.5" stop-color="#231f3a"/><stop offset="1" stop-color="#0c0a16"/></radialGradient>
  <radialGradient id="av-shade" cx="0.4" cy="0.35" r="0.72"><stop offset="0.7" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.45"/></radialGradient>
  <radialGradient id="av-eyeg" cx="0.4" cy="0.35" r="0.8"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfc7b8"/></radialGradient>
  <radialGradient id="av-aura"><stop offset="0.45" stop-color="#c5f24a" stop-opacity="0.22"/><stop offset="1" stop-color="#c5f24a" stop-opacity="0"/></radialGradient>
  <linearGradient id="av-tuftg" x1="0" y1="1" x2="0.3" y2="0"><stop offset="0" stop-color="#8fbf3a"/><stop offset="1" stop-color="#f1ffbe"/></linearGradient>
  <filter id="av-b3" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="av-b6" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="av-ball"><circle cx="130" cy="148" r="70"/></clipPath>
  <clipPath id="av-near"><rect x="-140" y="0" width="280" height="200"/></clipPath>
</defs>

<ellipse class="av-shadow" cx="130" cy="280" rx="52" ry="6" fill="#05040a" filter="url(#av-b3)"/>
<path class="av-star" style="animation-delay:0s" fill="#c5f24a" d="M26 63Q26 70 33 70Q26 70 26 77Q26 70 19 70Q26 70 26 63Z"/><path class="av-star" style="animation-delay:-1.2s" fill="#ef7fb0" d="M236 47Q236 52 241 52Q236 52 236 57Q236 52 231 52Q236 52 236 47Z"/><path class="av-star" style="animation-delay:-2.1s" fill="#ece6da" d="M40 235Q40 240 45 240Q40 240 40 245Q40 240 35 240Q40 240 40 235Z"/><path class="av-star" style="animation-delay:-0.6s" fill="#c5f24a" d="M228 230Q228 236 234 236Q228 236 228 242Q228 236 222 236Q228 236 228 230Z"/>

<g class="av-float">
  <circle cx="130" cy="148" r="112" fill="url(#av-aura)"/>
  
  <g transform="rotate(-24 130 148)">
    <g transform="translate(130 148) scale(1 0.3)">
      <circle r="98" fill="none" stroke="#ece6da" stroke-opacity="0.22" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
      <g class="av-spinA" style="animation-delay:0s">
        <circle r="98" fill="none"/>
        <g transform="translate(98 0)">
          <g class="av-keepA" style="animation-delay:0s">
            <ellipse rx="13" ry="43.333333333333336" fill="#ef7fb0" fill-opacity="0.35" filter="url(#av-b3)"/>
            <ellipse rx="7.5" ry="25" fill="#ef7fb0"/>
            <ellipse cx="-2" cy="-6.666666666666667" rx="2.6" ry="8.666666666666668" fill="#fff" fill-opacity="0.75"/>
          </g>
        </g>
      </g>
    </g>
  </g>
  
  <g transform="rotate(30 130 148)">
    <g transform="translate(130 148) scale(1 0.3)">
      <circle r="90" fill="none" stroke="#ece6da" stroke-opacity="0.22" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
      <g class="av-spinB" style="animation-delay:-3s">
        <circle r="90" fill="none"/>
        <g transform="translate(90 0)">
          <g class="av-keepB" style="animation-delay:-3s">
            <ellipse rx="13" ry="43.333333333333336" fill="#ece6da" fill-opacity="0.35" filter="url(#av-b3)"/>
            <ellipse rx="7.5" ry="25" fill="#ece6da"/>
            <ellipse cx="-2" cy="-6.666666666666667" rx="2.6" ry="8.666666666666668" fill="#fff" fill-opacity="0.75"/>
          </g>
        </g>
      </g>
    </g>
  </g>

  <g class="av-foot"><ellipse cx="108" cy="226" rx="15" ry="10" fill="url(#av-lime)"/></g>
  <g class="av-foot" style="animation-delay:-0.85s"><ellipse cx="154" cy="226" rx="15" ry="10" fill="url(#av-ink)"/></g>
  <g class="av-armL"><ellipse cx="60" cy="168" rx="13" ry="10" fill="url(#av-lime)"/></g>
  <g class="av-armR"><ellipse cx="201" cy="160" rx="13" ry="10" fill="url(#av-ink)"/></g>

  <path class="av-tuft" d="M118 86C108 62 128 56 124 34C144 48 150 68 140 88Z" fill="url(#av-tuftg)"/>

  <circle cx="130" cy="148" r="70" fill="url(#av-lime)"/>
  <g clip-path="url(#av-ball)">
    <path d="M40 60H214L206 84C170 104 112 150 66 214L40 226Z" fill="url(#av-ink)"/>
    <path d="M206 84C170 104 112 150 66 214" fill="none" stroke="#f4ffc8" stroke-width="3" stroke-opacity="0.65" filter="url(#av-b3)"/>
    <path d="M207 86C171 106 113 152 67 216" fill="none" stroke="#f4ffc8" stroke-width="1.2" stroke-opacity="0.7"/>
    <circle cx="130" cy="148" r="70" fill="url(#av-shade)"/>
    <ellipse cx="100" cy="106" rx="30" ry="16" transform="rotate(-32 100 106)" fill="#fff" fill-opacity="0.28" filter="url(#av-b6)"/>
    <ellipse cx="94" cy="100" rx="13" ry="5" transform="rotate(-32 94 100)" fill="#fff" fill-opacity="0.5" filter="url(#av-b3)"/>
    <path d="M182 196A70 70 0 0 0 199 160" fill="none" stroke="#f6ffd0" stroke-width="5" stroke-opacity="0.7" filter="url(#av-b3)"/>
  </g>

  <ellipse cx="92" cy="176" rx="11" ry="6" fill="#ef7fb0" fill-opacity="0.45" filter="url(#av-b3)"/>
  <ellipse cx="170" cy="176" rx="11" ry="6" fill="#ef7fb0" fill-opacity="0.5" filter="url(#av-b3)"/>
  <g class="av-eye">
    <ellipse cx="108" cy="150" rx="15" ry="19" fill="url(#av-eyeg)"/>
    <ellipse cx="152" cy="150" rx="15" ry="19" fill="url(#av-eyeg)"/>
    <g class="av-pupils">
      <circle cx="110" cy="153" r="9" fill="#0c0a16"/><circle cx="154" cy="153" r="9" fill="#0c0a16"/>
      <circle cx="113" cy="149" r="3.2" fill="#fff"/><circle cx="157" cy="149" r="3.2" fill="#fff"/>
      <circle cx="107" cy="157" r="1.5" fill="#fff" fill-opacity="0.7"/><circle cx="151" cy="157" r="1.5" fill="#fff" fill-opacity="0.7"/>
    </g>
  </g>
  <path d="M122 180Q131 189 141 179" fill="none" stroke="#1a1730" stroke-width="3.2" stroke-linecap="round"/>

  
  <g transform="rotate(-24 130 148)">
    <g transform="translate(130 148) scale(1 0.3)" clip-path="url(#av-near)">
      <circle r="98" fill="none" stroke="#ece6da" stroke-opacity="0.5" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
      <g class="av-spinA" style="animation-delay:0s">
        <circle r="98" fill="none"/>
        <g transform="translate(98 0)">
          <g class="av-keepA" style="animation-delay:0s">
            <ellipse rx="13" ry="43.333333333333336" fill="#ef7fb0" fill-opacity="0.35" filter="url(#av-b3)"/>
            <ellipse rx="7.5" ry="25" fill="#ef7fb0"/>
            <ellipse cx="-2" cy="-6.666666666666667" rx="2.6" ry="8.666666666666668" fill="#fff" fill-opacity="0.75"/>
          </g>
        </g>
      </g>
    </g>
  </g>
  
  <g transform="rotate(30 130 148)">
    <g transform="translate(130 148) scale(1 0.3)" clip-path="url(#av-near)">
      <circle r="90" fill="none" stroke="#ece6da" stroke-opacity="0.5" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
      <g class="av-spinB" style="animation-delay:-3s">
        <circle r="90" fill="none"/>
        <g transform="translate(90 0)">
          <g class="av-keepB" style="animation-delay:-3s">
            <ellipse rx="13" ry="43.333333333333336" fill="#ece6da" fill-opacity="0.35" filter="url(#av-b3)"/>
            <ellipse rx="7.5" ry="25" fill="#ece6da"/>
            <ellipse cx="-2" cy="-6.666666666666667" rx="2.6" ry="8.666666666666668" fill="#fff" fill-opacity="0.75"/>
          </g>
        </g>
      </g>
    </g>
  </g>
</g>
</g>
</svg>
