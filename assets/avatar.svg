<svg xmlns="http://www.w3.org/2000/svg" width="240" height="300" viewBox="0 0 240 300" role="img" aria-label="Avatar: a small cloaked figure in a helmet with lime eyes, headphones and a trailing scarf">
<title>Avatar</title>
<style>
.av * { transform-box: fill-box }
.av-bob { animation: av-bob 3.6s ease-in-out infinite alternate }
.av-shadow { transform-origin: center; animation: av-shadow 3.6s ease-in-out infinite alternate }
.av-tail { transform-origin: 100% 20%; animation: av-tail 2.4s ease-in-out infinite alternate }
.av-tail2 { transform-origin: 100% 20%; animation: av-tail 2.4s ease-in-out -0.5s infinite alternate }
.av-sway { transform-origin: 50% 0%; animation: av-sway 3.6s ease-in-out infinite alternate }
.av-head { transform-origin: 50% 100%; animation: av-head 7.2s ease-in-out infinite }
.av-eyes { animation: av-look 9s ease-in-out infinite }
.av-eye { transform-origin: center; animation: av-blink 4.5s ease-in-out infinite }
.av-pulse { transform-origin: center; animation: av-pulse 1.8s ease-in-out infinite }
.av-orb { animation: av-orb 2.8s ease-in-out infinite alternate }
.av-flip { transform-origin: center; animation: av-flip 5s ease-in-out infinite }
.av-face { animation: av-face 5s step-end infinite }
.av-star { transform-origin: center; animation: av-star 3s ease-in-out infinite }
@keyframes av-bob { from { transform: translateY(3px) } to { transform: translateY(-5px) } }
@keyframes av-shadow { from { transform: scaleX(1); opacity: 0.34 } to { transform: scaleX(0.84); opacity: 0.2 } }
@keyframes av-tail { from { transform: rotate(-7deg) } to { transform: rotate(8deg) } }
@keyframes av-sway { from { transform: skewX(-2deg) } to { transform: skewX(2deg) } }
@keyframes av-head { 0%, 100% { transform: rotate(-2deg) } 50% { transform: rotate(2.5deg) } }
@keyframes av-look { 0%, 30% { transform: none } 36%, 54% { transform: translateX(5px) } 60%, 78% { transform: translateX(-5px) } 84%, 100% { transform: none } }
@keyframes av-blink { 0%, 91% { transform: scaleY(1) } 94% { transform: scaleY(0.08) } 97%, 100% { transform: scaleY(1) } }
@keyframes av-pulse { 0%, 100% { transform: scale(0.7); opacity: 0.2 } 50% { transform: scale(1.5); opacity: 0.55 } }
@keyframes av-orb { from { transform: translateY(5px) } to { transform: translateY(-7px) } }
@keyframes av-flip { 0%, 38% { transform: rotate(45deg) scaleY(1) rotate(-45deg) } 44% { transform: rotate(45deg) scaleY(0) rotate(-45deg) } 50%, 88% { transform: rotate(45deg) scaleY(1) rotate(-45deg) } 94% { transform: rotate(45deg) scaleY(0) rotate(-45deg) } 100% { transform: rotate(45deg) scaleY(1) rotate(-45deg) } }
@keyframes av-face { 0% { fill: #c5f24a } 44% { fill: #2a2733 } 94% { fill: #c5f24a } }
@keyframes av-star { 0%, 100% { transform: scale(0.4); opacity: 0.15 } 50% { transform: scale(1); opacity: 0.9 } }
@media (prefers-reduced-motion: reduce) { .av * { animation: none !important } }
</style>
<g class="av" transform="scale(1)">
<defs>
  <radialGradient id="av-helmet" cx="0.34" cy="0.26" r="0.9"><stop offset="0" stop-color="#fffdf6"/><stop offset="0.5" stop-color="#ece6da"/><stop offset="1" stop-color="#b9ae9b"/></radialGradient>
  <linearGradient id="av-cloak" x1="0" y1="0" x2="0.25" y2="1"><stop offset="0" stop-color="#a99cff"/><stop offset="0.55" stop-color="#7463e6"/><stop offset="1" stop-color="#4536ad"/></linearGradient>
  <linearGradient id="av-scarf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcff7a"/><stop offset="1" stop-color="#9ccc2c"/></linearGradient>
  <linearGradient id="av-glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d1b22"/><stop offset="1" stop-color="#0b0a09"/></linearGradient>
  <pattern id="av-dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="#fff" fill-opacity="0.07"/></pattern>
  <clipPath id="av-visor"><rect x="68" y="74" width="104" height="54" rx="27"/></clipPath>
  <filter id="av-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<ellipse class="av-shadow" cx="120" cy="288" rx="46" ry="6" fill="#958d80"/>
<path class="av-star" style="animation-delay:0s" fill="#c5f24a" d="M28 89Q28 96 35 96Q28 96 28 103Q28 96 21 96Q28 96 28 89Z"/><path class="av-star" style="animation-delay:-1.1s" fill="#ef7fb0" d="M216 113Q216 118 221 118Q216 118 216 123Q216 118 211 118Q216 118 216 113Z"/><path class="av-star" style="animation-delay:-2s" fill="#ece6da" d="M38 221Q38 226 43 226Q38 226 38 231Q38 226 33 226Q38 226 38 221Z"/>
<g class="av-bob">
  <path class="av-tail2" d="M92 158C66 164 50 186 26 184L32 198C54 200 70 184 94 174Z" fill="#9ccc2c" stroke="#0b0a09" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <path class="av-tail" d="M92 150C62 146 46 166 16 154L22 174C46 182 64 166 94 168Z" fill="url(#av-scarf)" stroke="#0b0a09" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="104" y="244" width="11" height="28" rx="5" fill="#2a2733" stroke="#0b0a09" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="126" y="244" width="11" height="28" rx="5" fill="#2a2733" stroke="#0b0a09" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="97" y="266" width="22" height="12" rx="6" fill="#ece6da" stroke="#0b0a09" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="122" y="266" width="22" height="12" rx="6" fill="#ece6da" stroke="#0b0a09" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <g class="av-sway">
    <path d="M94 148C72 186 58 222 50 252Q68 264 86 252Q102 266 120 254Q138 266 154 252Q172 264 190 252C182 222 168 186 146 148Z" fill="url(#av-cloak)" stroke="#0b0a09" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M120 166L107 254Q120 262 133 254Z" fill="#241d52"/>
    <path d="M100 172C92 200 88 226 86 250M140 172C148 200 152 226 154 250M80 196C74 214 70 232 68 256M160 196C166 214 170 232 172 256" fill="none" stroke="#3a2c9c" stroke-width="2" stroke-linecap="round" stroke-opacity="0.65"/>
    <path d="M98 156C84 182 74 206 66 232" fill="none" stroke="#d2caff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.55"/>
  </g>
  <path d="M82 146Q120 168 158 146L160 160Q120 186 80 160Z" fill="url(#av-scarf)" stroke="#0b0a09" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <g class="av-head">
    <path d="M187 80L203 46" fill="none" stroke="#0b0a09" stroke-width="7" stroke-linecap="round"/>
    <path d="M187 80L203 46" fill="none" stroke="#ece6da" stroke-width="3" stroke-linecap="round"/>
    <circle class="av-pulse" cx="204" cy="42" r="10" fill="#ef7fb0"/>
    <circle cx="204" cy="42" r="6" fill="#ef7fb0" stroke="#0b0a09" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="54" y="38" width="132" height="116" rx="56" fill="url(#av-helmet)" stroke="#0b0a09" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M52 86C52 14 188 14 188 86" fill="none" stroke="#0b0a09" stroke-width="13" stroke-linecap="round"/>
    <path d="M52 86C52 14 188 14 188 86" fill="none" stroke="#f08a45" stroke-width="7" stroke-linecap="round"/>
    <rect x="41" y="80" width="21" height="44" rx="9" fill="#f08a45" stroke="#0b0a09" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="178" y="80" width="21" height="44" rx="9" fill="#f08a45" stroke="#0b0a09" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M47 90V114M193 90V114" stroke="#ffc08f" stroke-width="3" stroke-linecap="round"/>
    <rect x="68" y="74" width="104" height="54" rx="27" fill="url(#av-glass)" stroke="#0b0a09" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <g clip-path="url(#av-visor)">
      <rect x="68" y="74" width="104" height="54" fill="url(#av-dots)"/>
      <g class="av-eyes">
        <g filter="url(#av-glow)" opacity="0.55"><rect x="92" y="89" width="15" height="24" rx="7.5" fill="#c5f24a"/><rect x="133" y="89" width="15" height="24" rx="7.5" fill="#c5f24a"/></g>
        <rect class="av-eye" x="92" y="89" width="15" height="24" rx="7.5" fill="#c5f24a"/>
        <rect class="av-eye" x="133" y="89" width="15" height="24" rx="7.5" fill="#c5f24a"/>
        <path d="M114 119Q120 123 126 119" fill="none" stroke="#c5f24a" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <path d="M88 70L108 70L84 132L64 132Z" fill="#fff" fill-opacity="0.08"/>
      <path d="M116 70L124 70L100 132L92 132Z" fill="#fff" fill-opacity="0.05"/>
    </g>
    <path d="M74 62C82 50 96 44 110 43" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7"/>
  </g>
  <g class="av-orb">
    <g class="av-flip">
      <circle class="av-face" cx="212" cy="196" r="13" fill="#c5f24a" stroke="#0b0a09" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M204 191A10 10 0 0 1 213 186" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>
    </g>
  </g>
</g>
</g>
</svg>
