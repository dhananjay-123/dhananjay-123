<svg xmlns="http://www.w3.org/2000/svg" width="48" height="54" viewBox="0 0 48 54" role="img" aria-label="Email">
  <title>Email</title>
  <!-- One extruded tile, drawn locally so the four links load from a single
       origin in a single round trip instead of popping in one CDN at a time.
       Back face first, front face over it, bevel stroke on top: the 6px band
       left showing along the bottom is the extrusion. -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9BCFE"/>
      <stop offset="0.55" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cast" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="24" cy="49" rx="18" ry="4.5" fill="url(#cast)"/>
  <rect x="4" y="8" width="40" height="40" rx="11" fill="#5B21B6"/>
  <rect x="4" y="2" width="40" height="40" rx="11" fill="url(#face)"/>
  <rect x="4.5" y="2.5" width="39" height="39" rx="10.5" fill="none" stroke="url(#bevel)"/>
  <g fill="#140A26" transform="translate(13 11) scale(0.9167)">
    <path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z"/>
  </g>
</svg>
