<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" fill="none" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Dhananjay Agrawal — interface engineer</title>
  <desc id="heroDesc">A dark panel. On the left, the name Dhananjay Agrawal above the line TypeScript, React, Next.js, Postgres. On the right, a terminal window running whoami, ls of the work directory, and a check of every interface state.</desc>

  <style>
    /* One 14s session, looping. Each line carries its own timing inside its own
       keyframes so the transcript prints in order and clears together, and the
       hidden state never touches an element's own styling — switch the
       animation off and the finished terminal is what remains. */
    .l1 { animation: l1 14s steps(8) infinite }
    .l2 { animation: l2 14s steps(18) infinite }
    .l3 { animation: l3 14s steps(11) infinite }
    .l4 { animation: l4 14s steps(36) infinite }
    .l5 { animation: l5 14s steps(15) infinite }
    .l6 { animation: l6 14s steps(32) infinite }
    .l7 { animation: l7 14s steps(1) infinite }
    @keyframes l1 { 0%, 2.9% { clip-path: inset(0 100% 0 0) } 7.1%, 90% { clip-path: inset(0 0 0 0) } 92.9%, 100% { clip-path: inset(0 100% 0 0) } }
    @keyframes l2 { 0%, 8.2% { clip-path: inset(0 100% 0 0) } 10%, 90% { clip-path: inset(0 0 0 0) } 92.9%, 100% { clip-path: inset(0 100% 0 0) } }
    @keyframes l3 { 0%, 11.4% { clip-path: inset(0 100% 0 0) } 16.8%, 90% { clip-path: inset(0 0 0 0) } 92.9%, 100% { clip-path: inset(0 100% 0 0) } }
    @keyframes l4 { 0%, 17.9% { clip-path: inset(0 100% 0 0) } 20%, 90% { clip-path: inset(0 0 0 0) } 92.9%, 100% { clip-path: inset(0 100% 0 0) } }
    @keyframes l5 { 0%, 21.4% { clip-path: inset(0 100% 0 0) } 27.9%, 90% { clip-path: inset(0 0 0 0) } 92.9%, 100% { clip-path: inset(0 100% 0 0) } }
    @keyframes l6 { 0%, 28.9% { clip-path: inset(0 100% 0 0) } 31.4%, 90% { clip-path: inset(0 0 0 0) } 92.9%, 100% { clip-path: inset(0 100% 0 0) } }
    @keyframes l7 { 0%, 32.9% { clip-path: inset(0 100% 0 0) } 34.3%, 90% { clip-path: inset(0 0 0 0) } 92.9%, 100% { clip-path: inset(0 100% 0 0) } }

    /* The cursor is gated by the session on the group and blinks on its own
       clock inside it, so the two rates compose instead of fighting. */
    .gate { animation: gate 14s steps(1) infinite }
    @keyframes gate { 0%, 32.9% { opacity: 0 } 34.3%, 90% { opacity: 1 } 92.9%, 100% { opacity: 0 } }
    .blink { animation: blink 1.06s steps(1) infinite }
    @keyframes blink { 0%, 50% { opacity: 1 } 50.01%, 100% { opacity: 0 } }
    .mark { animation: mark 2.4s ease-in-out infinite }
    @keyframes mark { 0%, 100% { opacity: 1 } 50% { opacity: 0.25 } }

    @media (prefers-reduced-motion: reduce) {
      .l1, .l2, .l3, .l4, .l5, .l6, .l7, .gate, .blink, .mark { animation: none }
    }
  </style>

  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#141827"/>
    </pattern>
    <clipPath id="win"><rect x="560.5" y="36.5" width="271" height="147" rx="6"/></clipPath>
  </defs>

  <rect width="880" height="220" rx="10" fill="#0A0B11"/>
  <rect width="880" height="220" rx="10" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="879" height="219" rx="10" stroke="#1E2334"/>

  <g stroke="#A78BFA" stroke-width="1.25" opacity="0.55">
    <path d="M18 34 L18 18 L34 18"/>
    <path d="M862 34 L862 18 L846 18"/>
    <path d="M18 186 L18 202 L34 202"/>
    <path d="M862 186 L862 202 L846 202"/>
  </g>

  <rect class="mark" x="48" y="60" width="7" height="7" fill="#A78BFA"/>
  <text x="68" y="67" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2.6" fill="#A78BFA">INTERFACE ENGINEER</text>

  <text x="48" y="126" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="37" font-weight="600" letter-spacing="1.5" fill="#E6E8F2">DHANANJAY AGRAWAL</text>

  <line x1="48" y1="148" x2="300" y2="148" stroke="#1E2334"/>
  <line x1="48" y1="148" x2="94" y2="148" stroke="#A78BFA" opacity="0.8"/>

  <text x="48" y="177" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.6" fill="#7C86A8">TYPESCRIPT · REACT · NEXT.JS · POSTGRES</text>

  <!-- terminal window -->
  <rect x="560.5" y="36.5" width="271" height="147" rx="6" fill="#0D0F19" stroke="#1E2334"/>
  <g clip-path="url(#win)">
    <rect x="561" y="37" width="270" height="22" fill="#12162A"/>
    <line x1="561" y1="58.5" x2="831" y2="58.5" stroke="#1E2334"/>
    <circle cx="575" cy="48" r="3.2" fill="#A78BFA"/>
    <circle cx="587" cy="48" r="3.2" fill="#60A5FA"/>
    <circle cx="599" cy="48" r="3.2" fill="#2A3150"/>
    <text x="696" y="51" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" letter-spacing="1" fill="#7C86A8">dhananjay — zsh</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="0.3">
      <text class="l1" x="576" y="76" fill="#E6E8F2"><tspan fill="#A78BFA">$</tspan> whoami</text>
      <text class="l2" x="576" y="91" fill="#7C86A8">interface engineer</text>

      <text class="l3" x="576" y="106" fill="#E6E8F2"><tspan fill="#A78BFA">$</tspan> ls ~/work</text>
      <text class="l4" x="576" y="121" fill="#7C86A8" xml:space="preserve">design-systems  dashboards  realtime</text>

      <text class="l5" x="576" y="136" fill="#E6E8F2"><tspan fill="#A78BFA">$</tspan> ship --states</text>
      <text class="l6" x="576" y="151" fill="#7C86A8"><tspan fill="#60A5FA">✓</tspan> loading <tspan fill="#60A5FA">✓</tspan> empty <tspan fill="#60A5FA">✓</tspan> error <tspan fill="#60A5FA">✓</tspan> done</text>

      <text class="l7" x="576" y="166" fill="#A78BFA">$</text>
    </g>
    <g class="gate">
      <rect class="blink" x="587" y="158" width="6" height="10" fill="#DDD6FE"/>
    </g>
  </g>
</svg>
