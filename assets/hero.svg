<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" fill="none" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Dhananjay Agrawal — interface engineer</title>
  <desc id="heroDesc">A dark panel. On the left, the name Dhananjay Agrawal above the line TypeScript, React, Next.js, Postgres. On the right, an instrument readout with three signal traces and a sweeping scan line.</desc>

  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#14171C"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0A63C" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#F0A63C" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#F0A63C" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="scope"><rect x="561" y="37" width="270" height="146" rx="6"/></clipPath>
  </defs>

  <rect width="880" height="220" rx="10" fill="#0B0C0E"/>
  <rect width="880" height="220" rx="10" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="879" height="219" rx="10" stroke="#1C1F26"/>

  <g stroke="#F0A63C" stroke-width="1.25" opacity="0.55">
    <path d="M18 34 L18 18 L34 18"/>
    <path d="M862 34 L862 18 L846 18"/>
    <path d="M18 186 L18 202 L34 202"/>
    <path d="M862 186 L862 202 L846 202"/>
  </g>

  <rect x="48" y="60" width="7" height="7" fill="#F0A63C">
    <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <text x="68" y="67" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2.6" fill="#F0A63C">INTERFACE ENGINEER</text>

  <text x="48" y="126" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="37" font-weight="600" letter-spacing="1.5" fill="#E8E6E3">DHANANJAY AGRAWAL</text>

  <line x1="48" y1="148" x2="300" y2="148" stroke="#1C1F26"/>
  <line x1="48" y1="148" x2="300" y2="148" stroke="#F0A63C" stroke-dasharray="46 254">
    <animate attributeName="stroke-dashoffset" values="0;-300" dur="4.5s" repeatCount="indefinite"/>
  </line>

  <text x="48" y="177" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.6" fill="#767D89">TYPESCRIPT · REACT · NEXT.JS · POSTGRES</text>

  <rect x="560.5" y="36.5" width="271" height="147" rx="6" fill="#0E1014" stroke="#1C1F26"/>
  <g clip-path="url(#scope)">
    <path d="M576 72 L604 72 L612 56 L620 88 L628 72 L668 72 L676 64 L684 80 L692 72 L816 72" stroke="#262A31" stroke-width="1.25"/>
    <path d="M576 72 L604 72 L612 56 L620 88 L628 72 L668 72 L676 64 L684 80 L692 72 L816 72" stroke="#F0A63C" stroke-width="1.5" stroke-dasharray="34 300">
      <animate attributeName="stroke-dashoffset" values="0;-334" dur="3.2s" repeatCount="indefinite"/>
    </path>

    <path d="M576 104 L616 104 L624 92 L632 116 L640 104 L700 104 L708 98 L716 110 L724 104 L816 104" stroke="#262A31" stroke-width="1.25"/>
    <path d="M576 104 L616 104 L624 92 L632 116 L640 104 L700 104 L708 98 L716 110 L724 104 L816 104" stroke="#F0A63C" stroke-width="1.5" stroke-dasharray="34 300" opacity="0.85">
      <animate attributeName="stroke-dashoffset" values="0;-334" dur="4.1s" repeatCount="indefinite"/>
    </path>

    <path d="M576 136 L600 136 L600 124 L636 124 L636 136 L672 136 L672 126 L708 126 L708 136 L816 136" stroke="#262A31" stroke-width="1.25"/>
    <path d="M576 136 L600 136 L600 124 L636 124 L636 136 L672 136 L672 126 L708 126 L708 136 L816 136" stroke="#F0A63C" stroke-width="1.5" stroke-dasharray="34 300" opacity="0.7">
      <animate attributeName="stroke-dashoffset" values="0;-334" dur="5.3s" repeatCount="indefinite"/>
    </path>

    <line x1="576" y1="162" x2="816" y2="162" stroke="#1A1D23" stroke-dasharray="2 6"/>

    <g fill="#F0A63C">
      <circle cx="816" cy="72" r="2.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="816" cy="104" r="2.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="816" cy="136" r="2.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="5.3s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#262A31">
      <circle cx="576" cy="72" r="2"/><circle cx="576" cy="104" r="2"/><circle cx="576" cy="136" r="2"/>
    </g>

    <rect x="561" y="37" width="52" height="146" fill="url(#scan)">
      <animateTransform attributeName="transform" type="translate" values="-52 0;270 0" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
