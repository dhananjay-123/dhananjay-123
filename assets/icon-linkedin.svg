<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 24 24" role="img" aria-label="LinkedIn">
  <!-- Simple Icons dropped its LinkedIn mark and shields.io never had one, so
       this is drawn here to match the other icons: one solid accent-coloured
       tile with the wordmark knocked out, on a 24x24 grid like the CDN set. -->
  <mask id="li">
    <rect width="24" height="24" rx="3.4" fill="#fff"/>
    <circle cx="6.1" cy="6.3" r="1.9" fill="#000"/>
    <rect x="4.3" y="9.4" width="3.6" height="10.3" fill="#000"/>
    <rect x="9.6" y="9.4" width="3.5" height="10.3" fill="#000"/>
    <path d="M13.1 19.7 V14.6 a3.3 3.3 0 0 1 6.6 0 V19.7 Z" fill="#000"/>
  </mask>
  <rect width="24" height="24" rx="3.4" fill="#A78BFA" mask="url(#li)"/>
</svg>
